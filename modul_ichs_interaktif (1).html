                            className={`w-full py-3.5 rounded-2xl font-bold text-sm text-white transition-all ${
                                selectedOption === null 
                                ? 'bg-slate-300 dark:bg-slate-800 text-slate-500 cursor-not-allowed' 
                                : 'bg-brand-600 hover:bg-brand-500 shadow-lg shadow-brand-600/30'
                            }`}
                        >
                            Verifikasi Jawaban
                        </button>
                    ) : (
                        <button
                            onClick={handleNextQuestion}
                            className="w-full py-3.5 bg-slate-900 dark:bg-slate-100 dark:text-slate-900 text-white font-bold rounded-2xl hover:opacity-90 transition-all text-sm flex items-center justify-center gap-2"
                        >
                            Soal Berikutnya <i className="ph-bold ph-arrow-right"></i>
                        </button>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
